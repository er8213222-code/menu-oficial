<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Taconazo · Experiencia 3D</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#100b0a;color:#fff;font-family:Arial,sans-serif}canvas{display:block}

.panel.left{border-radius:7px 0 0 7px;border-right:2px solid #a47b51}.panel.right{border-radius:0 7px 7px 0}.panel h2{font-family:Georgia,serif;font-size:clamp(16px,2.6vw,26px);text-align:center;margin:0 0 10px;color:#9e3529}.panel h3{font-size:clamp(12px,2vw,17px);color:#8c3024;border-bottom:1px solid #c3a27a;margin:11px 0 5px}.item{display:flex;justify-content:space-between;gap:7px;padding:3px 0}.item span:last-child{font-weight:bold;white-space:nowrap}

@media(max-width:560px){#sheetWrap{height:51dvh;top:52%}.panel{padding:9px;font-size:10px}.item{padding:2px 0}#controls{bottom:10px;gap:5px}#controls button{padding:14px 13px;font-size:13px;min-height:48px}#hands .hand{height:45px}.forearm{height:65px}}
</style></head><body>
<div id="intro"><div class="introBox"><div class="kicker">UNA EXPERIENCIA INTERACTIVA</div><h1 class="brand">EL TACONAZO</h1><p class="sub">LA CARTA DIGITAL</p><button id="play">JUGAR</button><p class="note">Entra, toma asiento y descubre el menú.</p></div></div><div id="fade"></div>

<script type="module">

scene.add(new THREE.HemisphereLight(0xfff0d9,0x604536,2.1));const light=new THREE.PointLight(0xffe1b3,65,20);light.position.set(0,3,1);scene.add(light);

}

extBox(2.3,1.25,8.45,2.2,2.2,.12,0x202529);
const signCanvas=document.createElement('canvas');signCanvas.width=1024;signCanvas.height=160;
const sc=signCanvas.getContext('2d');sc.fillStyle='#161819';sc.fillRect(0,0,1024,160);sc.fillStyle='#f5ce26';sc.font='bold 77px Georgia';sc.textAlign='center';sc.fillText('EL TACONAZO',512,100);
const signTex=new THREE.CanvasTexture(signCanvas);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(5.5,.85),new THREE.MeshBasicMaterial({map:signTex}));sign.position.set(0,3.48,7.48);facade.add(sign);
const bone=new THREE.MeshStandardMaterial({color:0xece5d5,roughness:.75});
function bonePart(parent,x,y,z,w,h,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),bone);m.position.set(x,y,z);parent.add(m);return m}
const skull=new THREE.Group();skull.position.set(0,4.35,8.5);facade.add(skull);

for(const x of [-.12,.12]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.095,12,8),new THREE.MeshBasicMaterial({color:0x101010}));eye.position.set(x,.04,.225);skull.add(eye)}
for(const x of [-.27,.27])bonePart(skull,x,-.62,0,.075,.67,.08);
for(let i=0;i<4;i++)bonePart(skull,0,-.46-i*.11,.05,.68-i*.045,.036,.08);

bonePart(waveArm,.27,.1,0,.5,.07,.08);bonePart(waveArm,.54,.35,0,.07,.53,.08);
for(let i=0;i<4;i++)bonePart(waveArm,.47+i*.07,.67,0,.04,.18,.04);
const leftBone=bonePart(skull,-.6,-.34,0,.56,.07,.08);leftBone.rotation.z=-.3;
const facadeLight=new THREE.PointLight(0xffffff,90,12);facadeLight.position.set(0,3.4,10);facade.add(facadeLight);
// Objetos pequeños: saleros, servilletero con servilletas, recipientes de salsa y cucharas.

function cylinder(x,y,z,r,h,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat);m.position.set(x,y,z);scene.add(m);return m}
const dark=new THREE.MeshStandardMaterial({color:0x272727,roughness:.4});
const sauceColors=[0x357e39,0x8a3321,0x8d9a5c];
for(let i=0;i<3;i++){const x=.33+i*.25,z=.88;cylinder(x,.89,z,.105,.12,silver);cylinder(x,.955,z,.085,.035,new THREE.MeshStandardMaterial({color:sauceColors[i]}));const spoon=cylinder(x+.055,1.055,z,.012,.23,silver);spoon.rotation.z=.36}
cylinder(-.45,.91,.88,.06,.2,silver);cylinder(-.45,1.02,.88,.052,.02,dark);
for(let i=0;i<8;i++){const dot=new THREE.Mesh(new THREE.SphereGeometry(.006,5,5),dark);dot.position.set(-.45+(i%3-1)*.022,1.036,.88+Math.floor(i/3)*.015);scene.add(dot)}

for(let i=0;i<6;i++)block(-.05,1.128+i*.003,.88,.18,.006,.105,0xf5f0e5);

document.querySelector('#p1').innerHTML='<h2>EL TACONAZO</h2><p style="text-align:center">Tripa: sábados y domingos</p>'+rows('TACOS · MAÍZ / HARINA',['$17 / $18','$17 / $18','$17 / $18','$17 / $18','$18 / $19'])+rows('TORTAS',['$45','$45','$45','$45','$50']);

const fade=document.querySelector('#fade'),intro=document.querySelector('#intro'),hud=document.querySelector('#hud'),wrap=document.querySelector('#sheetWrap'),sheet=document.querySelector('#sheet');let stage='intro',start=0,handActionUntil=0;

function frame(){requestAnimationFrame(frame);const now=performance.now();
