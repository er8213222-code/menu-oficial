<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Taconazo · Carta 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#361c17;color:#fff;font-family:Georgia,serif;overflow:hidden}.scene{height:100dvh;perspective:1100px;background:radial-gradient(ellipse at 50% 55%,#b63b30,#732019 75%);display:flex;align-items:center;justify-content:center;flex-direction:column}.top{position:absolute;top:12px;text-align:center;z-index:5;font-family:Arial}.top h1{margin:0;font-size:22px}.top p{font-size:12px;margin:5px}.book{width:min(94vw,900px);height:min(67dvh,540px);display:flex;position:relative;filter:drop-shadow(8px 15px 12px #230e0eb0);transform:rotateX(8deg);transform-style:preserve-3d}.page{background:#fff2d9;color:#48271a;width:50%;padding:clamp(9px,2.5vw,26px);overflow:auto;box-shadow:inset 0 0 18px #c2a784;font-family:Arial,sans-serif;font-size:clamp(10px,1.7vw,14px)}.page:first-child{border-radius:8px 0 0 8px;border-right:2px solid #c9a77b}.page:last-child{border-radius:0 8px 8px 0}.page h2{text-align:center;font-size:clamp(15px,2.3vw,24px);margin:4px 0 12px;color:#912f23}.page h3{font-size:clamp(12px,2vw,17px);margin:12px 0 4px;border-bottom:1px solid #bd9b75}.item{display:flex;justify-content:space-between;gap:6px;padding:3px 0}.item span:last-child{white-space:nowrap;font-weight:bold}.hands{position:absolute;inset:auto 0 -18px;display:flex;justify-content:space-between;pointer-events:none}.hand{font-size:clamp(32px,7vw,70px);filter:drop-shadow(2px 5px 3px #3c1b13);transform:rotate(-20deg)}.hand:last-child{transform:scaleX(-1) rotate(-20deg)}.turn{animation:turn .65s ease-in-out}@keyframes turn{50%{transform:rotateY(-12deg) rotateX(8deg)}}.legs{position:absolute;bottom:-13px;display:flex;gap:55px;z-index:0}.leg{width:62px;height:85px;background:#294d82;border-radius:25px 25px 5px 5px}.controls{z-index:4;display:flex;gap:12px;margin-top:25px;align-items:center;font-family:Arial}button,.upload{background:#ffe4aa;color:#532718;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;font-size:13px}.upload input{display:none}.status{font-size:12px;max-width:170px;text-align:center}.tripa{color:#ffe29a;font-weight:bold}.hint{font-size:11px;color:#ffe7c7;margin-top:7px;text-align:center}@media(max-width:550px){.book{height:60dvh}.page{font-size:10px}.controls{gap:5px}button,.upload{padding:9px 7px;font-size:11px}.legs{display:none}}</style></head><body><div class="scene"><header class="top"><h1>🌮 EL TACONAZO</h1><p id="tripa">Tripa únicamente sábados y domingos</p></header><div class="book" id="book"><div class="page" id="left"></div><div class="page" id="right"></div><div class="hands"><span class="hand">🤲</span><span class="hand">🤲</span></div></div><div class="legs"><div class="leg"></div><div class="leg"></div></div><div class="controls"><button id="prev">◀ Anterior</button><span class="status" id="status">Páginas 1–2</span><button id="next">Siguiente ▶</button><label class="upload">🎵 Música<input type="file" id="music" accept="audio/*"></label><button id="mute">🔊</button></div><div class="hint">Vista previa · La música se elige desde tu teléfono</div></div><audio id="audio" loop></audio><script>
const meat=['Pastor','Birria','Chorizo','Bistec','Tripa'];function section(title,prices){return '<h3>'+title+'</h3>'+meat.map((m,i)=>'<div class="item"><span>'+m+'</span><span>'+prices[i]+'</span></div>').join('')}
const pages=[
'<h2>TACOS Y TORTAS</h2><p style="text-align:center;font-size:11px">Tripa solo sábados y domingos</p>'+section('Tacos · maíz / harina',['$17 / $18','$17 / $18','$17 / $18','$17 / $18','$18 / $19'])+section('Tortas',['$45','$45','$45','$45','$50']),
'<h2>ESPECIALIDADES</h2>'+section('Empalmadas',['$45','$45','$45','$45','$47'])+section('Gringas',['$45','$45','$45','$45','$47'])+section('Quesadillas',['$40','$40','$40','$40','$45']),
'<h2>MÁS ANTOJITOS</h2>'+section('Tostadas',['$20','$20','$20','$20','$22'])+section('Volcanes',['$22','$22','$22','$22','$24'])+section('Mulitas',['$24','$24','$24','$24','$26']),
'<h2>ANTOJITOS Y BEBIDAS</h2>'+section('Burritos',['$37','$37','$37','$37','$39'])+'<h3>Quesabirria</h3><div class="item"><span>Con consomé</span><span>$45</span></div><h3>Refrescos</h3>'+[['Coca-Cola vidrio 355 ml','$30'],['Coca-Cola 600 ml','$35'],['Fresca / Squirt / Mundet vidrio','$30'],['Agua mineral vidrio','$30'],['Topo Chico','$35']].map(x=>'<div class="item"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join('')+'<h3>Aguas frescas</h3><div class="item"><span>Jamaica / Horchata chica</span><span>$20</span></div><div class="item"><span>Jamaica / Horchata mediana</span><span>$25</span></div><h3>Botanas</h3>Patitas de puerco'
];let pair=0;function show(){document.querySelector('#left').innerHTML=pages[pair*2];document.querySelector('#right').innerHTML=pages[pair*2+1];document.querySelector('#status').textContent='Páginas '+(pair*2+1)+'–'+(pair*2+2)}function flip(p){if(p===pair||p<0||p>1)return;const b=document.querySelector('#book');b.classList.add('turn');setTimeout(()=>{pair=p;show()},320);setTimeout(()=>b.classList.remove('turn'),700)}document.querySelector('#next').onclick=()=>flip(pair+1);document.querySelector('#prev').onclick=()=>flip(pair-1);const a=document.querySelector('#audio');document.querySelector('#music').onchange=e=>{const f=e.target.files[0];if(!f)return;a.src=URL.createObjectURL(f);a.play().catch(()=>{});document.querySelector('#mute').textContent='🔊'};document.querySelector('#mute').onclick=()=>{if(!a.src){document.querySelector('#music').click();return}a.muted=!a.muted;document.querySelector('#mute').textContent=a.muted?'🔇':'🔊'};const d=new Date().getDay();if(d===0||d===6)document.querySelector('#tripa').textContent='🌮 ¡HOY SÍ HAY TRIPA! · Sujeto a existencias';show();
</script></body></html>
