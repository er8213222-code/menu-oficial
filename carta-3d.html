<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Taconazo | Carta interactiva</title><style>
*{box-sizing:border-box}body{margin:0;background:#241411;color:#fff;font-family:Arial,sans-serif;overflow:hidden}canvas{display:block}#intro{position:fixed;inset:0;z-index:9;background:linear-gradient(145deg,#220f0c,#873027);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}#intro>div{border:1px solid #e4b66a;padding:32px;border-radius:16px;background:#180c0bdb;max-width:440px}h1{font-size:clamp(28px,7vw,52px);letter-spacing:3px;margin:10px 0}p{line-height:1.5}button{border:0;border-radius:9px;padding:13px 18px;background:#f1c67d;color:#3b2014;font-weight:800;cursor:pointer;font-size:15px}#ui{display:none;position:fixed;inset:0;pointer-events:none}#ui button{pointer-events:auto}#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#170e0dcc;padding:10px 18px;border-radius:10px;text-align:center;font-size:14px;max-width:90vw}#nav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#1b100fd9;padding:8px;border-radius:12px;white-space:nowrap}#nav button{font-size:13px;padding:10px 12px}#pageLabel{font-size:12px}#musicNotice{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);background:#1b100fe6;padding:10px;border-radius:9px;display:none;text-align:center;pointer-events:auto;font-size:12px}#musicNotice label{display:block;margin-top:6px;cursor:pointer;color:#f1c67d}#musicNotice input{max-width:240px}#help{font-size:12px;opacity:.8}@media(max-width:520px){#nav{gap:5px}#nav button{padding:9px;font-size:11px}#top{font-size:12px}#pageLabel{font-size:11px}}</style></head><body>
<div id="intro"><div><div id="help">CARTA INTERACTIVA EN 3D</div><h1>EL TACONAZO</h1><p>Siéntate a la mesa y descubre nuestro menú. Voltea la hoja para ver el reverso.</p><button id="start">JUGAR / VER MENÚ</button><p id="help">La música empieza al entrar, si el archivo está disponible.</p></div></div>
<div id="ui"><div id="top">EL TACONAZO · <span id="tripa">Tripa: sábados y domingos</span></div><div id="nav"><button id="back">◀ Voltear</button><span id="pageLabel">Frente</span><button id="next">Voltear ▶</button><button id="sound">Sonido</button></div><div id="musicNotice">No se encontró música válida en el sitio.<label>Elegir canción desde este dispositivo <input type="file" id="choose" accept="audio/*"></label></div></div>
<audio id="music" src="audio.mp3" loop preload="none"></audio>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8d6953);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,60);camera.position.set(0,1.75,3.35);camera.lookAt(0,1.45,.1);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff2dc,0x69412c,2));const lamp=new THREE.DirectionalLight(0xffffff,2.5);lamp.position.set(-2,5,3);scene.add(lamp);
function mesh(geo,color,x,y,z,material){const m=new THREE.Mesh(geo,material||new THREE.MeshStandardMaterial({color,roughness:.8,side:THREE.DoubleSide}));m.position.set(x,y,z);scene.add(m);return m}
function block(x,y,z,w,h,d,c){return mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z)}
block(0,-.05,0,20,.1,20,0x95765e);block(0,1.02,-.35,3.8,.12,2.65,0x9d2923);block(0,.55,-.35,.22,.95,.22,0x3c2620);block(0,.12,-.35,1.6,.12,1.3,0x3c2620);
block(0,.58,3.3,1.2,.12,.8,0xe3ad24);block(0,.97,3.65,1.2,.9,.13,0xe3ad24);
for(const x of [-.3,.3]){const leg=block(x,.34,2.65,.36,.75,.45,0x28496d);leg.rotation.x=-.15;block(x,.08,2.2,.38,.14,.7,0x282321)}
// Una sola hoja física, con contenido distinto por cada cara.
const items=[
[['TACOS · MAÍZ / HARINA','Pastor   $17 / $18','Birria   $17 / $18','Chorizo   $17 / $18','Bistec   $17 / $18','Tripa   $18 / $19'],['TORTAS','Pastor   $45','Birria   $45','Chorizo   $45','Bistec   $45','Tripa   $50'],['EMPALMADAS','Pastor, Birria, Chorizo, Bistec   $45','Tripa   $47'],['GRINGAS','Pastor, Birria, Chorizo, Bistec   $45','Tripa   $47']],
[['TOSTADAS','Pastor, Birria, Chorizo, Bistec   $20','Tripa   $22'],['VOLCANES','Pastor, Birria, Chorizo, Bistec   $22','Tripa   $24'],['MULITAS','Pastor, Birria, Chorizo, Bistec   $24','Tripa   $26'],['BURRITOS','Pastor, Birria, Chorizo, Bistec   $37','Tripa   $39'],['QUESADILLAS','Pastor, Birria, Chorizo, Bistec   $40','Tripa   $45'],['QUESABIRRIA','Con consomé   $45'],['BEBIDAS','Coca-Cola vidrio   $30','Coca-Cola 600 ml   $35','Fresca, Squirt, Mundet vidrio   $30','Agua mineral vidrio   $30','Topo Chico   $35','Jamaica / Horchata chica   $20','Jamaica / Horchata mediana   $25'],['BOTANAS','Patitas de puerco']]
];
function texture(groups,side){const c=document.createElement('canvas');c.width=1024;c.height=1400;const ctx=c.getContext('2d');ctx.fillStyle='#f9eed6';ctx.fillRect(0,0,1024,1400);ctx.strokeStyle='#b68b53';ctx.lineWidth=13;ctx.strokeRect(25,25,974,1350);ctx.fillStyle='#78351e';ctx.textAlign='center';ctx.font='bold 48px Georgia';ctx.fillText('EL TACONAZO',512,103);ctx.font='25px Arial';ctx.fillText(side,512,142);let y=183;const allLines=groups.reduce((n,g)=>n+g.length+1,0);const step=Math.min(38,Math.max(22,1100/allLines));for(const group of groups){ctx.fillStyle='#9e3928';ctx.font='bold 29px Arial';ctx.fillText(group[0],512,y);y+=step+8;ctx.fillStyle='#3b2a20';ctx.font='24px Arial';for(const line of group.slice(1)){ctx.fillText(line,512,y);y+=step}y+=step*.35}ctx.fillStyle='#865d3e';ctx.font='20px Arial';ctx.fillText('Tripa disponible sábados y domingos',512,1350);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const pivot=new THREE.Group();pivot.position.set(0,1.67,.45);scene.add(pivot);const front=texture(items[0],'CARTA · FRENTE'),back=texture(items[1],'CARTA · REVERSO');const sheet=new THREE.Mesh(new THREE.BoxGeometry(1.9,.014,2.35),[new THREE.MeshStandardMaterial({color:0xe4c99d}),new THREE.MeshStandardMaterial({color:0xe4c99d}),new THREE.MeshStandardMaterial({map:front}),new THREE.MeshStandardMaterial({map:back}),new THREE.MeshStandardMaterial({color:0xe4c99d}),new THREE.MeshStandardMaterial({color:0xe4c99d})]);pivot.add(sheet);sheet.rotation.x=-.25;
// Brazos y manos hechos con geometría real: sin emojis.
const skin=new THREE.MeshStandardMaterial({color:0xc98b61,roughness:.9});const sleeve=new THREE.MeshStandardMaterial({color:0xeeeeea});
function hand(x){const g=new THREE.Group();const arm=new THREE.Mesh(new THREE.CylinderGeometry(.105,.12,.7,10),skin);arm.rotation.x=-.72;arm.position.set(0,-.21,.28);g.add(arm);const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.19,10),sleeve);cuff.rotation.x=-.72;cuff.position.set(0,-.43,.5);g.add(cuff);const palm=new THREE.Mesh(new THREE.BoxGeometry(.2,.1,.24),skin);palm.position.set(0,.08,-.05);g.add(palm);for(let i=0;i<4;i++){const finger=new THREE.Mesh(new THREE.CylinderGeometry(.024,.028,.17,8),skin);finger.rotation.x=.25;finger.position.set(-.072+i*.048,.14,-.15);g.add(finger)}g.position.set(x,1.18,1.12);scene.add(g);return g}
const left=hand(-.84),right=hand(.84);
let target=0,animating=false,started=false;function turn(to){if(animating||!started)return;target=to;animating=true;document.querySelector('#pageLabel').textContent=to===0?'Frente':'Reverso'}
document.querySelector('#next').onclick=()=>turn(Math.PI);document.querySelector('#back').onclick=()=>turn(0);
const music=document.querySelector('#music'),notice=document.querySelector('#musicNotice');document.querySelector('#choose').onchange=e=>{const f=e.target.files[0];if(f){music.src=URL.createObjectURL(f);music.play().then(()=>notice.style.display='none').catch(()=>{})}};
document.querySelector('#sound').onclick=()=>{if(music.paused){music.play().catch(()=>notice.style.display='block')}else music.pause()};
document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#intro').style.display='none';document.querySelector('#ui').style.display='block';music.play().catch(()=>notice.style.display='block')};
const day=new Date().getDay();if(day===0||day===6)document.querySelector('#tripa').textContent='HOY SÍ HAY TRIPA · sujeto a existencias';
function frame(){requestAnimationFrame(frame);if(animating){const delta=target-pivot.rotation.y;if(Math.abs(delta)<.015){pivot.rotation.y=target;animating=false}else pivot.rotation.y+=delta*.085;const t=Math.abs(Math.sin(pivot.rotation.y));left.position.y=1.18+t*.12;right.position.y=1.18+t*.12}renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
